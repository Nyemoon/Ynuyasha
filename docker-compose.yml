services:
  ynuyasha:
    build: .
    container_name: ynuyasha
    restart: always
    network_mode: "host"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - OLLAMA_HOST=http://127.0.0.1:11434
      - OLLAMA_BASE_URL=http://127.0.0.1:11434

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ynuyasha

volumes:
  caddy_data:
  caddy_config:
